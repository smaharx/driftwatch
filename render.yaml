services:
  - type: web
    name: driftwatch-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driftwatch-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SLACK_WEBHOOK_URL
        value: ""

databases:
  - name: driftwatch-db
    databaseName: driftwatch
    user: driftwatch
    plan: free